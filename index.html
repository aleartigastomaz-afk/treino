<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Treino ABCDE</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" id="touchicon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* sem zoom por toque duplo (iPhone) */
html,body,button,a,input,select,label{touch-action:manipulation}
/* Layout: app de uma coluna para o celular, cabeçalho no topo, barra de abas fixa embaixo. Visual escuro de "garagem" com o vermelho das pecinhas. */
:root{
  --bg:#0d1422; --panel:#151f33; --panel2:#1c2942; --line:#2a3a5c;
  --fg:#eef2f8; --muted:#8e9bb5; --accent:#e63946; --onaccent:#fff; --gold:#f2c94c; --ok:#3ecf8e;
  --A:#e63946; --B:#3b82f6; --C:#f2c94c; --D:#3ecf8e; --E:#c084fc;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}

:root[data-pal="pista"]{--bg:#111111;--panel:#1b1b1b;--panel2:#262626;--line:#343434;--fg:#f5f5f5;--muted:#9b9b9b;--accent:#ff5a1f;--onaccent:#fff}
:root[data-pal="gramado"]{--bg:#06140d;--panel:#0e2318;--panel2:#153121;--line:#21452f;--fg:#effaf2;--muted:#8fb09b;--accent:#ffd60a;--onaccent:#06140d}
:root[data-pal="chope"]{--bg:#16100a;--panel:#231a10;--panel2:#2e2216;--line:#4a3622;--fg:#fbf3e6;--muted:#b39f84;--accent:#f59e0b;--onaccent:#16100a}
:root[data-pal="claro"]{--bg:#f2f3f5;--panel:#ffffff;--panel2:#eceef2;--line:#d8dce3;--fg:#141821;--muted:#667085;--accent:#e11d48;--onaccent:#fff;--gold:#a16207;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
html{padding-top:env(safe-area-inset-top,0px)}body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;padding-bottom:calc(86px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
header.top img{width:40px;height:40px;border-radius:10px}
.brand{flex:1;min-width:0}
.brand b{font-family:var(--display);font-size:22px;white-space:nowrap;letter-spacing:.02em;text-transform:uppercase;display:block;line-height:1}
.brand small{color:var(--muted);font-size:12px}
.who{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.who button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.who button.on{background:var(--accent);color:var(--onaccent)}
.gear{flex:none;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted)}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gear.on{color:var(--accent);border-color:var(--accent)}
.colors{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colors label{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;font-weight:600;font-size:14px;cursor:pointer}
.colors input[type=color]{width:40px;height:40px;border:0;border-radius:10px;padding:0;background:none;flex:none;cursor:pointer}
.colors input[type=color]::-webkit-color-swatch-wrapper{padding:0}.colors input[type=color]::-webkit-color-swatch{border:2px solid var(--line);border-radius:10px}
.colors small{display:block;color:var(--muted);font-weight:500;font-size:12px;font-variant-numeric:tabular-nums}
.chips button .sw.rainbow{background:conic-gradient(#ff3b30,#ffcc00,#34c759,#0a84ff,#bf5af2,#ff3b30)}

main .wrap{display:flex;flex-direction:column;gap:16px;padding-block:16px}
h2{font-family:var(--display);font-size:30px;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1;text-wrap:balance}
h3{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin:0;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo{background:color-mix(in srgb,var(--gold) 14%,var(--panel));border:1px dashed var(--gold);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.demo button{background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.readonly{background:color-mix(in srgb,var(--B) 18%,var(--panel));border:1px solid var(--B);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.readonly button{background:var(--B);border:0;color:#fff;border-radius:8px;padding:6px 10px;font-weight:600;font-size:12px}

.cycle{background:var(--panel);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}

.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.letters button{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 0;font-family:var(--display);font-size:26px;font-weight:800;line-height:1}
.letters button span{display:block;font-family:var(--body);font-size:10px;font-weight:600;color:var(--muted);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.letters button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 22%,var(--panel))}

.ex{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;border-left:4px solid transparent;transition:opacity .2s}
.ex.done{border-left-color:var(--ok)}
.ex.done .exname{color:var(--muted);text-decoration:line-through}
.exhead{display:flex;gap:10px;align-items:flex-start}
.exname{font-weight:600;flex:1;min-width:0}
.exmeta{font-size:12px;color:var(--muted)}
.check{flex:none;width:40px;height:40px;border-radius:12px;border:2px solid var(--line);background:var(--panel2);display:grid;place-items:center;font-size:20px;color:transparent}
.ex.done .check{background:var(--ok);border-color:var(--ok);color:#0d1422}
/* exemplo do movimento: duas fotos (início e fim) que se alternam */
.demo-img{position:relative;display:block;width:100%;aspect-ratio:3/2;border-radius:14px;overflow:hidden;background:color-mix(in srgb,var(--fg) 8%,transparent);border:1px solid color-mix(in srgb,var(--fg) 14%,transparent);padding:0;cursor:zoom-in}
.demo-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.demo-img img+img{animation:demoflip 2.6s ease-in-out infinite}
@keyframes demoflip{0%,38%{opacity:0}50%,88%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.demo-img img+img{animation-duration:5s}}
.demo-img .tag{position:absolute;left:8px;bottom:8px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:99px;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.exopen{all:unset;cursor:pointer;display:block;font-weight:600;flex:1;min-width:0;-webkit-tap-highlight-color:transparent}
.exopen .see{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:12px;font-weight:600;color:var(--accent)}
.ex.done .exopen{color:var(--muted);text-decoration:line-through}
.demobox{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.45);padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));animation:fadein .18s ease-out}
.demobox[hidden]{display:none}
.demobox .sheet{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;padding:14px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid color-mix(in srgb,var(--fg) 16%,transparent);border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.4);backdrop-filter:blur(26px) saturate(170%);-webkit-backdrop-filter:blur(26px) saturate(170%);animation:sheetup .22s ease-out}
.demobox .sheet .demo-img{cursor:default}
.demobox h3{margin:0;font-size:18px}
.demobox .row2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.demobox .x{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);background:color-mix(in srgb,var(--fg) 8%,transparent);color:var(--fg);font-size:18px;cursor:pointer}
.demobox .credit{font-size:11px;color:var(--muted)}
@keyframes fadein{from{opacity:0}}
@keyframes sheetup{from{transform:translateY(30px);opacity:0}}
.weight{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;background:var(--panel2);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:none;width:42px;height:44px;font-size:22px;font-weight:600}
.stepper input{width:70px;height:44px;border:0;background:none;text-align:center;font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none}
.kg{font-size:13px;color:var(--muted);margin-left:-4px;margin-right:4px}
.last{font-size:12px;color:var(--muted)}
.up{font-size:12px;font-weight:600;color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent);padding:3px 8px;border-radius:99px}
.sets{display:flex;gap:8px;flex-wrap:wrap}
.sets button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:none;font-weight:700;font-size:14px;color:var(--muted)}
.sets button.on{background:var(--ok);border-color:var(--ok);color:#0d1422}
.big{border:0;border-radius:16px;padding:16px;font-family:var(--display);font-size:24px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;background:var(--accent);color:var(--onaccent);width:100%}
.big.ghost{background:var(--panel);color:var(--muted)}
.placebox .pl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.placebox .pl button{border:1.5px solid color-mix(in srgb,var(--fg) 18%,transparent);background:color-mix(in srgb,var(--fg) 6%,transparent);border-radius:14px;padding:12px 6px;font-weight:700;font-size:15px;color:var(--fg);display:flex;align-items:center;justify-content:center;gap:6px}
.placebox .pl button.on{background:color-mix(in srgb,var(--accent) 32%,transparent);border-color:var(--accent)}
.placebox .geo{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0}
.small{font-size:12px}
.endbox input[type=time]{background:color-mix(in srgb,var(--fg) 8%,transparent);border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);border-radius:12px;padding:8px 12px;font-family:var(--display);font-size:22px;font-weight:700;color:var(--fg);min-width:110px}
.stepper input{border-radius:10px;background:color-mix(in srgb,var(--fg) 7%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--fg) 22%,transparent)}
.stepper input:focus{outline:2px solid var(--accent);outline-offset:-2px}
.gymrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.gymrow b{flex:1;min-width:120px}
.gymrow button{border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);background:color-mix(in srgb,var(--fg) 6%,transparent);color:var(--fg);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600}
.tips{font-size:12px;color:var(--muted);background:var(--panel);border-radius:12px;padding:10px 12px}

.cal{background:var(--panel);border-radius:16px;padding:12px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calnav b{font-family:var(--display);font-size:24px;text-transform:uppercase}
.calnav button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-size:18px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid7 .dow{font-size:11px;color:var(--muted);font-weight:600;padding:4px 0}
.day{aspect-ratio:1;max-width:100%;border:0;border-radius:10px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg);padding:0}
.day.out{background:none;color:transparent;pointer-events:none}
.day.today{outline:2px solid var(--gold)}
.day.sel{outline:2px solid var(--fg)}
.day.tr{background:color-mix(in srgb,var(--c) 30%,var(--panel2))}
.day i{font-style:normal;font-family:var(--display);font-weight:800;font-size:15px;color:var(--c);line-height:1}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.detail{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}
.detail .li{display:flex;justify-content:space-between;gap:10px;font-size:14px;border-bottom:1px solid var(--line);padding-block:6px}
.detail .li:last-child{border-bottom:0}
.detail .li b{font-variant-numeric:tabular-nums;white-space:nowrap}

.card{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
select{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.chart{width:100%;height:auto;display:block}
.pr{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding-block:6px;border-bottom:1px solid var(--line)}
.pr:last-child{border-bottom:0}
.pr b{font-variant-numeric:tabular-nums;white-space:nowrap}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
.inline button,.btn{background:var(--accent);border:0;border-radius:10px;padding:10px 14px;font-weight:600;color:var(--onaccent)}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure{margin:0;position:relative}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.photos figcaption{position:absolute;left:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.6);padding:2px 6px;border-radius:6px;color:#fff}
label.file{display:block;text-align:center;border:2px dashed var(--line);border-radius:12px;padding:14px;color:var(--muted);font-weight:600}
label.file input{display:none}

.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.person{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:4px solid var(--c)}
.person .av{display:flex;align-items:center;gap:8px}
.person .av b{width:34px;height:34px;border-radius:50%;background:var(--c);color:#0d1422;display:grid;place-items:center;font-family:var(--display);font-size:20px}
.person .av span{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.kv{display:flex;flex-direction:column}
.kv b{font-family:var(--display);font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;padding-block:6px;border-bottom:1px solid var(--line);font-size:14px}
.vs:last-child{border-bottom:0}
.vs b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.vs b.win{color:var(--gold)}
.vs small{color:var(--muted);font-size:12px;max-width:150px}
.feed .li{display:flex;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line);font-size:14px}
.feed .li:last-child{border-bottom:0}
.dot{width:28px;height:28px;border-radius:8px;background:var(--c);color:#0d1422;display:grid;place-items:center;font-family:var(--display);font-weight:800;flex:none}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:none;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--fg)}
nav.tabs button.on svg{stroke:var(--accent)}

.timer{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-weight:600}
.timer b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;min-width:58px}
.timer button{border:0;border-radius:999px;padding:8px 12px;background:var(--bg);color:var(--fg);font-weight:600;font-size:13px}
.timer.end{background:var(--gold)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:8;background:var(--ok);color:#0d1422;font-weight:700;padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.look{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.look .head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.look .head button{background:none;border:0;color:var(--muted);font-size:13px;font-weight:600}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.chips button{border:2px solid var(--line);border-radius:12px;background:var(--panel2);padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--muted)}
.chips button.on{border-color:var(--accent);color:var(--fg)}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid rgba(128,128,128,.4)}
.logos{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.logos button{border:3px solid transparent;border-radius:18px;padding:0;background:none;overflow:hidden;aspect-ratio:1;max-width:100%}
.logos button.on{border-color:var(--accent)}
.logos img{width:100%;height:100%;display:block}
.agenda{background:var(--panel);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px}
.agenda .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.agenda .ah button{background:none;border:0;color:var(--accent);font-weight:600;font-size:13px}
.ag{display:flex;align-items:center;gap:12px;padding-block:8px;border-bottom:1px solid var(--line)}
.ag:last-child{border-bottom:0}
.ag .tm{font-family:var(--display);font-weight:700;font-size:18px;min-width:86px;font-variant-numeric:tabular-nums;color:var(--muted)}
.ag .act{flex:1;min-width:0;font-weight:600}
.ag .act small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.ag .ico{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:18px;flex:none}
.ag .tick{flex:none;width:36px;height:36px;border-radius:10px;border:2px solid var(--line);background:none;color:transparent;font-size:18px;display:grid;place-items:center}
.ag .tick.on{background:var(--ok);border-color:var(--ok);color:#0d1422}
.ag.done .act{color:var(--muted)}
.ag .del{flex:none;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--muted);font-size:16px}
.week h4{margin:10px 0 2px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.addag{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.addag select,.addag input{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
.addag .full{grid-column:1/-1}
/* ---- vidro (aba Agenda) ---- */
body.glass{background:transparent}
body.glass::after{content:"";position:fixed;inset:-15%;z-index:-1;pointer-events:none;
  background:radial-gradient(45% 32% at 10% 15%,color-mix(in srgb,var(--accent) 85%,transparent),transparent 72%),
  radial-gradient(42% 30% at 92% 30%,color-mix(in srgb,var(--B) 80%,transparent),transparent 72%),
  radial-gradient(48% 34% at 22% 70%,color-mix(in srgb,var(--E) 70%,transparent),transparent 72%),
  radial-gradient(40% 30% at 88% 90%,color-mix(in srgb,var(--D) 65%,transparent),transparent 72%);filter:blur(40px);opacity:.85}
body.glass header.top{background:color-mix(in srgb,var(--bg) 45%,transparent);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border-bottom-color:color-mix(in srgb,var(--fg) 12%,transparent)}
body.glass::before{background:color-mix(in srgb,var(--bg) 45%,transparent)}
.gl{background:color-mix(in srgb,var(--fg) 7%,transparent);border:1px solid color-mix(in srgb,var(--fg) 16%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 18%,transparent),0 10px 30px rgba(0,0,0,.22);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border-radius:22px}
.ag-head{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.ag-head button{border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--fg)}
.ag-head button.on{background:var(--accent);color:var(--onaccent);border-color:transparent}
.next{padding:18px;display:flex;gap:16px;align-items:center}
.next .big-ico{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:34px;flex:none;background:color-mix(in srgb,var(--accent) 28%,transparent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.next .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.next .ttl{font-family:var(--display);font-size:30px;font-weight:800;text-transform:uppercase;line-height:1.05}
.next .when{font-size:14px;color:var(--muted)}
.next .when b{color:var(--fg)}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.strip button{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:16px;color:var(--fg)}
.strip button span{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.strip button b{font-family:var(--display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.strip button i{display:flex;gap:3px;height:6px}
.strip button i u{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--fg) 30%,transparent);text-decoration:none}
.strip button i u.d{background:var(--ok)}
.strip button.sel{background:color-mix(in srgb,var(--accent) 30%,transparent);border-color:color-mix(in srgb,var(--accent) 70%,transparent)}
.strip button.td b{color:var(--accent)}
.strip button.sel.td b{color:var(--fg)}
.tl{display:flex;flex-direction:column;gap:10px;position:relative;padding-left:4px}
.tl-row{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:stretch}
.tl-time{font-family:var(--display);font-weight:700;font-size:17px;padding-top:16px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.tl-card{padding:14px;display:flex;align-items:center;gap:12px;min-width:0}
.tl-card .ico{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:color-mix(in srgb,var(--fg) 9%,transparent)}
.tl-card .act{flex:1;min-width:0;font-weight:700;font-size:16px}
.tl-card .act small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.tl-card.done .act{opacity:.6}
.tl-card .tick{flex:none;width:40px;height:40px;border-radius:14px;border:1.5px solid color-mix(in srgb,var(--fg) 25%,transparent);background:none;color:transparent;font-size:18px;display:grid;place-items:center}
.tl-card .tick.on{background:var(--ok);border-color:var(--ok);color:#0d1422}
.tl-card .tick[disabled]{opacity:.35}
.tl-card .del{flex:none;width:40px;height:40px;border-radius:14px;border:1px solid color-mix(in srgb,#ff6b6b 50%,transparent);background:color-mix(in srgb,#ff6b6b 14%,transparent);color:#ff8a8a;font-size:16px}
.tl-empty{padding:22px;text-align:center;color:var(--muted)}
.sum{padding:16px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum h3{grid-column:1/-1;text-align:left}
.ring{position:relative;width:72px;height:72px;margin:0 auto}
.ring svg{width:72px;height:72px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.sum span.l{font-size:12px;color:var(--muted);font-weight:600}
.addsheet{padding:16px;display:flex;flex-direction:column;gap:10px}
.addsheet .addag select,.addsheet .addag input{background:color-mix(in srgb,var(--fg) 8%,transparent);border:1px solid color-mix(in srgb,var(--fg) 18%,transparent);border-radius:12px}
/* ---- vidro no app inteiro ---- */
body.glass{--panel:color-mix(in srgb,var(--fg) 7%,transparent);--panel2:color-mix(in srgb,var(--fg) 9%,transparent);--line:color-mix(in srgb,var(--fg) 14%,transparent)}
body.glass .ex,body.glass .cycle,body.glass .cal,body.glass .stat,body.glass .detail,body.glass .card,body.glass .person,body.glass .agenda,body.glass .tips,body.glass .letters button,body.glass .demo,body.glass .readonly{
  border:1px solid color-mix(in srgb,var(--fg) 15%,transparent);box-shadow:inset 0 1px 0 color-mix(in srgb,#fff 16%,transparent),0 10px 30px rgba(0,0,0,.2);
  backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);border-radius:22px}
body.glass .letters button{border-radius:16px;border-width:1.5px}
body.glass .letters button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 30%,transparent)}
body.glass .ex{border-left-width:4px}
body.glass .ex.done{border-left-color:var(--ok)}
body.glass .person{border-top:4px solid var(--c)}
body.glass .demo{border-style:dashed;border-color:var(--gold)}
body.glass .readonly{border-color:var(--B)}
body.glass .day{background:color-mix(in srgb,var(--fg) 6%,transparent)}
body.glass .day.tr{background:color-mix(in srgb,var(--c) 35%,transparent)}
body.glass .day.out{background:none}
body.glass .stepper,body.glass .check,body.glass .gear,body.glass .who,body.glass select,body.glass .inline input{backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
body.glass .big.ghost{background:color-mix(in srgb,var(--fg) 8%,transparent);border:1px solid color-mix(in srgb,var(--fg) 15%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
body.glass .big:not(.ghost){box-shadow:0 10px 30px color-mix(in srgb,var(--accent) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
body.glass nav.tabs{background:color-mix(in srgb,var(--bg) 40%,transparent);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border-top-color:color-mix(in srgb,var(--fg) 12%,transparent)}
body.glass .auth{background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px)}
.auth{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(40px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
.authbox{max-width:380px;margin:0 auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.authbox img{margin:0 auto;border-radius:20px}
.authbox form{display:flex;flex-direction:column;gap:8px;text-align:left}
.authbox label{font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.authbox input{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px}
.authbox .big{margin-top:10px}
.linkbtn{background:none;border:0;color:var(--accent);font-weight:600;padding:10px}
.err{color:#ff6b6b;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const br=s=>{const d=parse(s);return pad(d.getDate())+"/"+pad(d.getMonth()+1)};
let TODAY=ymd(new Date());
const fmt=n=>(Math.round(n*10)/10).toString().replace(".",",");
const exList=L=>PLAN[L].ex.map((e,i)=>({id:L+i,name:e[0],sets:e[1],reps:e[2],comp:!!e[3]}));
const allEx=LET.split("").flatMap(exList);
const exById=id=>allEx.find(e=>e.id===id);
/* Exemplo em imagens. "card" = foto já aparece no exercício; "toque" = foto abre ao tocar no nome */
let IMGMODE="toque";
const demoImg=(id,lazy)=>`<img src="img/ex/${id}_0.jpg" alt="" ${lazy?'loading="lazy"':""} decoding="async"><img src="img/ex/${id}_1.jpg" alt="" ${lazy?'loading="lazy"':""} decoding="async">`;
function openDemo(id){const e=exById(id);if(!e)return;let b=$("#demobox");
  if(!b){b=document.createElement("div");b.id="demobox";b.className="demobox";b.setAttribute("role","dialog");b.setAttribute("aria-modal","true");document.body.appendChild(b);
    b.addEventListener("click",ev=>{if(ev.target===b||ev.target.closest(".x"))closeDemo()})}
  b.innerHTML=`<div class="sheet"><div class="row2"><h3>${esc(e.name)}</h3><button type="button" class="x" aria-label="Fechar">✕</button></div>
  <div class="demo-img">${demoImg(e.id)}<span class="tag">início ⇄ fim</span></div>
  <div class="row2"><span class="muted">${e.sets} séries × ${e.reps} · descanso ${e.comp?"90 s":"60 s"}</span></div>
  <span class="credit">Foto ilustrativa: Free Exercise DB (domínio público). A máquina da sua academia pode ser um pouco diferente.</span></div>`;
  b.hidden=false}
function closeDemo(){const b=$("#demobox");if(b)b.hidden=true}
document.addEventListener("keydown",ev=>{if(ev.key==="Escape")closeDemo()});
const repMid=r=>{const m=r.match(/^(\d+)(?:–(\d+))?$/);return m?(+m[1]+ +(m[2]||m[1]))/2:0};

/* ---------- dados (Firebase) ---------- */
let DB={me:null,users:{},look:{pal:"pista",logo:"foto",open:true}};
try{const c=JSON.parse(localStorage.getItem(KEY+"-look"));if(c)DB.look=c}catch(e){}
document.documentElement.dataset.pal=DB.look.pal;
let saveT=null;
function save(){try{localStorage.setItem(KEY+"-look",JSON.stringify(DB.look))}catch(e){}
  clearTimeout(saveT);saveT=setTimeout(()=>{saveT=null;const me=U(DB.me);if(!me||!window.FB)return;
    window.FB.save({name:USERS[DB.me]||"",sessions:me.sessions,body:me.body,photos:me.photos,agenda:me.agenda||null,extras:me.extras||{},gyms:me.gyms||{},look:DB.look,updated:Date.now()}).catch(err=>toast("Não consegui salvar online. Tento de novo quando tiver internet."))},500)}
let pendingRender=false;
window.onData=(uid,all)=>{
  DB.me=uid;const ids=Object.keys(all);
  if(!all[uid]){all[uid]={name:window.pendingName||"Eu",sessions:{},body:[],photos:[]};}
  const order=[uid,...ids.filter(i=>i!==uid).sort()];
  USERS={};UCOL={};const cols=["var(--accent)","var(--B)","var(--D)","var(--E)"];
  const users={};order.forEach((i,n)=>{const d=all[i];USERS[i]=d.name||"Atleta";UCOL[i]=cols[n%4];
    users[i]=(i===uid&&saveT&&DB.users[i])?DB.users[i]:{sessions:d.sessions||{},body:d.body||[],photos:d.photos||[],agenda:d.agenda||undefined,extras:d.extras||{},gyms:d.gyms||{}}});
  DB.users=users;
  if(all[uid].look&&!saveT)DB.look=all[uid].look;
  if(!all[uid].updated&&!ids.includes(uid))save();
  $("#auth").hidden=true;
  const a=document.activeElement;if(a&&a.tagName==="INPUT"&&$("#view").contains(a)){pendingRender=true;return}
  render();
};
document.addEventListener("focusout",()=>{if(pendingRender){pendingRender=false;setTimeout(render,50)}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){const t=ymd(new Date());if(t!==TODAY){TODAY=t;st.sel=t;st.letter=null;if(DB.me)render()}}});
window.showAuth=()=>{DB.me=null;$("#auth").hidden=false};
window.toastMsg=t=>toast(t);
window.onRuns=(uid,all)=>{RUNS=all;window.onRunsMine&&window.onRunsMine(uid,all[uid]);if(!DB.me)return;const a=document.activeElement;if(a&&a.tagName==="INPUT"&&$("#view").contains(a)){pendingRender=true;return}render()};
const U=u=>DB.users[u];
const hasDemo=()=>false;
function clearDemo(){Object.values(DB.users).forEach(x=>{for(const k in x.sessions)if(x.sessions[k].demo)delete x.sessions[k];x.body=x.body.filter(b=>!b.demo)});save();render();toast("Exemplos apagados")}

/* ---------- consultas ---------- */
const trained=s=>s&&(s.finished||Object.values(s.done||{}).some(a=>a.some(Boolean)));
function lastWeight(u,id,before){const ks=Object.keys(U(u).sessions).filter(k=>k<before).sort().reverse();for(const k of ks){const w=U(u).sessions[k].weights?.[id];if(w)return{kg:w,date:k}}return null}
function pesoHist(u,id){return Object.keys(U(u).sessions).sort().map(k=>({date:k,kg:U(u).sessions[k].weights?.[id]})).filter(x=>x.kg)}
function shouldGoUp(u,e,before){const h=Object.keys(U(u).sessions).filter(k=>k<before).sort().reverse().map(k=>U(u).sessions[k]).filter(s=>s.weights?.[e.id]).slice(0,2);
  return h.length===2&&h[0].weights[e.id]===h[1].weights[e.id]&&h.every(s=>(s.done?.[e.id]||[]).filter(Boolean).length>=e.sets)}
function monthCount(u,y,m){return Object.entries(U(u).sessions).filter(([k,s])=>trained(s)&&parse(k).getFullYear()===y&&parse(k).getMonth()===m).length}
function weekKey(k){const d=parse(k);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}
function streak(u){const wk={};Object.entries(U(u).sessions).forEach(([k,s])=>{if(trained(s))wk[weekKey(k)]=(wk[weekKey(k)]||0)+1});
  let n=0,d=parse(weekKey(TODAY));if((wk[ymd(d)]||0)<3)d.setDate(d.getDate()-7);
  while((wk[ymd(d)]||0)>=3){n++;d.setDate(d.getDate()-7)}return n}
function lastSession(u){const k=Object.keys(U(u).sessions).filter(k=>trained(U(u).sessions[k])).sort().pop();return k?{k,s:U(u).sessions[k]}:null}
function prs(u){const best={},out=[];Object.keys(U(u).sessions).sort().forEach(k=>{const w=U(u).sessions[k].weights||{};for(const id in w){if(!best[id]||w[id]>best[id].kg){if(best[id])out.push({id,kg:w[id],date:k,from:best[id].kg});best[id]={kg:w[id],date:k}}}});return{best,news:out.reverse()}}
function weekVolume(u){const wk=weekKey(TODAY);let v=0;Object.entries(U(u).sessions).forEach(([k,s])=>{if(weekKey(k)!==wk)return;for(const id in s.weights||{}){const e=exById(id);const n=(s.done?.[id]||[]).filter(Boolean).length;v+=s.weights[id]*n*repMid(e.reps)}});return v}

function lineChart(series,{h=170,unit="kg"}={}){
  const pts=series.flatMap(s=>s.data);if(pts.length<1)return`<p class="muted">Ainda sem registros. Os pesos aparecem aqui depois do primeiro treino.</p>`;
  const W=340,H=h,L=36,R=12,T=14,B=26;
  const ds=[...new Set(pts.map(p=>p.date))].sort(),x0=parse(ds[0]).getTime(),x1=parse(ds[ds.length-1]).getTime()||x0+1;
  let lo=Math.min(...pts.map(p=>p.kg)),hi=Math.max(...pts.map(p=>p.kg));if(lo===hi){lo-=5;hi+=5}const padv=(hi-lo)*.15;lo=Math.max(0,lo-padv);hi+=padv;
  const X=d=>L+(x1===x0?.5:(parse(d).getTime()-x0)/(x1-x0))*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g="";for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line)" stroke-dasharray="3 4"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="10" style="fill:var(--muted)">${fmt(v)}</text>`}
  g+=`<text x="${L}" y="${H-6}" font-size="10" style="fill:var(--muted)">${br(ds[0])}</text><text x="${W-R}" y="${H-6}" text-anchor="end" font-size="10" style="fill:var(--muted)">${br(ds[ds.length-1])}</text>`;
  series.forEach((s,si)=>{if(!s.data.length)return;const p=s.data.map(d=>`${X(d.date)},${Y(d.kg)}`).join(" ");
    if(si===0&&series.length===1)g+=`<polygon points="${X(s.data[0].date)},${H-B} ${p} ${X(s.data[s.data.length-1].date)},${H-B}" style="fill:${s.color};opacity:.15"/>`;
    g+=`<polyline points="${p}" style="fill:none;stroke:${s.color}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const e=s.data[s.data.length-1];g+=`<circle cx="${X(e.date)}" cy="${Y(e.kg)}" r="5" style="fill:${s.color};stroke:var(--panel)" stroke-width="2"/><text x="${Math.min(X(e.date),W-R-30)}" y="${Y(e.kg)-10}" font-size="12" font-weight="700" style="fill:var(--fg)">${fmt(e.kg)} ${unit}</text>`});
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`}

function distM(a,b){const r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r;const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*6371e3*Math.asin(Math.sqrt(h))}
function getPos(){return new Promise((ok,no)=>{if(!navigator.geolocation)return no({code:9});navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),no,{enableHighAccuracy:true,timeout:15000,maximumAge:60000})})}
function nearest(u,p){let best=null;const G=gymsOf(u);for(const k in PLACES)(G[k]||[]).forEach(g=>{const d=distM(p,g);if(!best||d<best.d)best={k,d}});return best&&best.d<=Math.max(350,Math.min(p.acc||0,800))?best:null}

  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button type="button" data-tab="${k}" class="${st.tab===k?"on":""}"><svg viewBox="0 0 24 24">${ICONS[k]}</svg>${l}</button>`).join("");
  const banner=hasDemo()?`<div class="demo"><span>Treinos de exemplo para você ver como fica.</span><button type="button" id="cleardemo">Apagar exemplos</button></div>`:"";
  $("#gear").classList.toggle("on",st.tab==="ajustes");
  $("#view").innerHTML=(["ajustes","eu","agenda"].includes(st.tab)?"":banner)+({hoje:vHoje,cal:vCal,prog:vProg,dupla:vDupla,ajustes:vAjustes,eu:vEu,agenda:vAgenda}[st.tab])();
  if(st.tab==="hoje"&&!st.view&&DB.me){const s=U(DB.me).sessions[TODAY];const L=st.letter||s?.letter||defaultLetter();if(L&&!(s&&s.place)&&hasGyms(DB.me)&&st.geoAuto!==TODAY){st.geoAuto=TODAY;setTimeout(()=>detectPlace(L),400)}}
}
document.addEventListener("click",ev=>{
  const t=ev.target.closest("button");if(!t||!DB.me)return;const D=t.dataset;
  if(D.tab){st.tab=D.tab;st.view=null;render();scrollTo(0,0);return}
  if(D.me){DB.me=D.me;st.view=null;st.letter=null;save();render();toast("Agora você é "+USERS[D.me]);return}
  if(t.id==="cleardemo")return clearDemo();
  if(t.id==="menu"){st.tab="agenda";st.view=null;render();scrollTo(0,0);return}
  if(t.id==="logout"){window.FB.logout();return}
  if(D.pal){DB.look.pal=D.pal;save();render();return}
  if(D.logo){DB.look.logo=D.logo;save();render();return}
  if(t.id==="goeu"){st.tab="agenda";render();scrollTo(0,0);return}
  if(t.id==="stconnect"){window.FB&&window.FB.stravaConnect();return}
  if(t.id==="stsync"){if(window.FB){toast("Buscando corridas...");window.FB.stravaSync(true)}return}
  if(t.id==="stdisc"){if(t.dataset.sure){window.FB&&window.FB.stravaDisconnect()}else{t.dataset.sure="1";t.textContent="toque de novo para desconectar"}return}
  if(t.id==="agedit"){st.agEdit=!st.agEdit;render();return}
  if(D.agsel){st.agSel=D.agsel;render();return}
  if(D.ex){const[k,i]=D.ex.split("|");const it=(agendaOf(DB.me)[parse(k).getDay()]||[])[+i];if(it){const x=U(DB.me);x.extras=x.extras||{};const m=x.extras[k]=x.extras[k]||{};m[agKey(it)]=!m[agKey(it)];if(!m[agKey(it)])delete m[agKey(it)];save();render();if(m[agKey(it)])toast(it.t+" feito! 💪")}return}
  if(D.extra!==undefined&&D.extra!==""&&!D.agdel){const it=(agendaOf(DB.me)[parse(TODAY).getDay()]||[])[+D.extra];if(it){const x=U(DB.me);x.extras=x.extras||{};const m=x.extras[TODAY]=x.extras[TODAY]||{};m[agKey(it)]=!m[agKey(it)];if(!m[agKey(it)])delete m[agKey(it)];save();render();if(m[agKey(it)])toast(it.t+" feito! 💪")}return}
  if(D.agdel){const[d,i]=D.agdel.split(":");const ag=agendaOf(DB.me);ag[d].splice(+i,1);if(!ag[d].length)delete ag[d];save();render();return}
  if(t.id==="gear"){st.tab=st.tab==="ajustes"?"hoje":"ajustes";st.view=null;render();scrollTo(0,0);return}
  if(t.id==="back"){st.view=null;render();return}
  if(D.see){st.view=D.see;st.tab="cal";render();scrollTo(0,0);return}
  if(D.demo){openDemo(D.demo);return}
  if(D.l){st.letter=D.l;render();return}
  if(D.mon){let[y,m]=st.month;m+=+D.mon;if(m<0){m=11;y--}if(m>11){m=0;y++}st.month=[y,m];render();return}
  if(D.day){st.sel=D.day;render();return}
  if(D.gymhere){saveGymHere(D.gymhere);return}
  if(D.gymdel){if(t.dataset.sure){delete gymsOf(DB.me)[D.gymdel];save();render();toast("Lugar apagado")}else{t.dataset.sure="1";t.textContent="Toque de novo"}return}
  if(D.cplace){const s=U(DB.me).sessions[st.sel];if(s){if(s.place===D.cplace)delete s.place;else s.place=D.cplace;delete s.placeAuto;save();render()}return}
  const L=st.letter||U(DB.me).sessions[TODAY]?.letter||defaultLetter();
  if(D.geo){detectPlace(L);return}
  if(D.place){pickPlace(L,D.place);return}
  if(D.step){const inp=$("#w-"+D.id);const v=numIn(inp.value)||0;const s=v>=30?2.5:1;const n=Math.max(0,Math.round((v+ +D.step*s)*100)/100);inp.value=kgTxt(n);const S=ensureSess(L);S.weights[D.id]=n;save();return}
  if(D.set){const e=exById(D.set),S=ensureSess(L);const arr=S.done[e.id]||Array(e.sets).fill(false);arr[+D.i]=!arr[+D.i];S.done[e.id]=arr;
    const inp=$("#w-"+e.id);if(inp&&inp.value&&!S.weights[e.id]&&numIn(inp.value)>=0)S.weights[e.id]=numIn(inp.value);if(arr[+D.i]&&!S.start)S.start=nowHM();save();
    if(arr[+D.i]&&arr.filter(Boolean).length<e.sets)startTimer(e.comp?90:60);render();return}
  if(D.all){const e=exById(D.all),S=ensureSess(L);const full=(S.done[e.id]||[]).filter(Boolean).length>=e.sets;S.done[e.id]=Array(e.sets).fill(!full);
    const inp=$("#w-"+e.id);if(inp&&inp.value&&!S.weights[e.id]&&numIn(inp.value)>=0)S.weights[e.id]=numIn(inp.value);if(!full&&!S.start)S.start=nowHM();save();render();return}
  if(t.id==="finish"){const S=ensureSess(L);if(S.finished){S.finished=false;delete S.end}else{exList(L).forEach(e=>{const inp=$("#w-"+e.id);if(inp&&inp.value&&!S.weights[e.id]&&numIn(inp.value)>=0)S.weights[e.id]=numIn(inp.value)});S.finished=true;S.end=nowHM();toast("Treino "+L+" concluído às "+S.end+"! 💪")}save();render();return}
});
document.addEventListener("focusin",ev=>{const t=ev.target;if(t.dataset&&t.dataset.w)setTimeout(()=>{try{t.select()}catch(e){}},0)});
function setW(t){const L=st.letter||U(DB.me).sessions[TODAY]?.letter||defaultLetter();const S=ensureSess(L);const v=numIn(t.value);if(v>=0)S.weights[t.dataset.w]=v;else delete S.weights[t.dataset.w];save()}
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&ev.target.dataset&&ev.target.dataset.w)ev.target.blur()});
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset&&t.dataset.w&&DB.me){setW(t);return}if(t.id==="c-bg"||t.id==="c-ac"){const[bg,ac]=curColors();DB.look.bg=t.id==="c-bg"?t.value:bg;DB.look.accent=t.id==="c-ac"?t.value:ac;DB.look.pal="custom";applyLook();$("#"+t.id+"-v").textContent=t.value.toUpperCase()}});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.id==="c-bg"||t.id==="c-ac"){save();render();return}
  if(t.dataset.w){setW(t);return}
  if(t.dataset.end){const s=U(DB.me).sessions[t.dataset.end];if(s){if(t.value)s.end=t.value;else delete s.end;save();toast(t.value?"Horário salvo: "+t.value:"Horário apagado");if(t.dataset.end!==TODAY)render()}return}
  if(t.id==="prog-ex"){st.prog=t.value;render();return}
  if(t.id==="cmp-ex"){st.cmp=t.value;render();return}
  if(t.id==="photo-in"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),s=Math.min(1,480/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);U(DB.me).photos.push({date:TODAY,src:c.toDataURL("image/jpeg",.75)});save();render();toast("Foto salva")};img.src=fr.result};fr.readAsDataURL(t.files[0])}
});
document.addEventListener("submit",ev=>{ev.preventDefault();
  if(ev.target.id==="agform"){const d=$("#ag-dia").value,hh=$("#ag-h").value.trim(),tt=$("#ag-t").value.trim();if(!hh||!tt)return toast("Preencha o horário e a atividade");const ag=agendaOf(DB.me);(ag[d]=ag[d]||[]).push({h:hh,t:tt});ag[d].sort((a,b)=>a.h.localeCompare(b.h));save();render();toast("Adicionado em "+DIAS[d]);return}if(ev.target.id==="bwform"){const v=parseFloat(String($("#bw-in").value).replace(",","."));if(!(v>0))return toast("Digite o peso em kg");const b=U(DB.me).body.filter(x=>x.date!==TODAY);b.push({date:TODAY,kg:v});U(DB.me).body=b;save();render();toast("Peso salvo")}});
try{applyLook()}catch(e){}
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,doc,setDoc,getDoc,deleteDoc,onSnapshot,collection} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {firebaseConfig,strava} from "./firebase-config.js";
const $=s=>document.querySelector(s);
if(!firebaseConfig.apiKey||firebaseConfig.apiKey.startsWith("COLE")){$("#auth").hidden=false;$("#authmsg").textContent="Falta ligar o app ao Firebase (arquivo firebase-config.js).";$("#authform").hidden=true;$("#a-toggle").hidden=true;throw new Error("sem config")}
const app=initializeApp(firebaseConfig),auth=getAuth(app);
const db=initializeFirestore(app,{localCache:persistentLocalCache()});
window.STRAVA={ready:!!(strava&&strava.clientId&&(strava.fnUrl||strava.tokenUrl))};
async function stTok(body){const r=await fetch(strava.tokenUrl,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.message||j.error||"Erro "+r.status);return j}
async function stLocal(action,code){const uid=auth.currentUser.uid,priv=doc(db,"strava_tokens",uid),pub=doc(db,"corridas",uid);
  if(action==="connect"){const j=await stTok({grant_type:"authorization_code",code});await setDoc(priv,{access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at});await setDoc(pub,{connected:true,name:[j.athlete&&j.athlete.firstname,j.athlete&&j.athlete.lastname].filter(Boolean).join(" ")},{merge:true})}
  if(action==="disconnect"){await deleteDoc(priv).catch(()=>{});await setDoc(pub,{connected:false},{merge:true});return{ok:true}}
  const s=await getDoc(priv);if(!s.exists())return{connected:false};let t=s.data();
  if(t.expires_at<Date.now()/1e3+120){const j=await stTok({grant_type:"refresh_token",refresh_token:t.refresh_token});t={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at};await setDoc(priv,t)}
  const after=Math.floor(Date.now()/1e3)-90*86400;const r=await fetch("https://www.strava.com/api/v3/athlete/activities?after="+after+"&per_page=200",{headers:{Authorization:"Bearer "+t.access_token}});const acts=await r.json().catch(()=>[]);if(!r.ok)throw new Error((acts&&acts.message)||"Erro "+r.status);
  const runs={};for(const a of acts){const ty=a.sport_type||a.type||"";if(!/Run/.test(ty))continue;const d=String(a.start_date_local);runs[a.id]={date:d.slice(0,10),hour:d.slice(11,16),name:a.name||"",dist:a.distance||0,time:a.moving_time||0,type:ty,hr:a.average_heartrate||null,elev:a.total_elevation_gain||0}}
  await setDoc(pub,{connected:true,runs,lastSync:Date.now()},{merge:true});return{ok:true,count:Object.keys(runs).length}}
async function stCall(action,code){if(strava.tokenUrl)return stLocal(action,code);const t=await auth.currentUser.getIdToken();const r=await fetch(strava.fnUrl,{method:"POST",headers:{"Authorization":"Bearer "+t,"Content-Type":"application/json"},body:JSON.stringify({action,code})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Erro "+r.status);return j}
let lastAuto=0;
window.FB={save:data=>setDoc(doc(db,"atletas",auth.currentUser.uid),data),logout:()=>signOut(auth),
  stravaConnect:()=>{const redir=location.origin+location.pathname;location.href="https://www.strava.com/oauth/authorize?client_id="+strava.clientId+"&response_type=code&approval_prompt=auto&scope=activity:read_all&state=treino&redirect_uri="+encodeURIComponent(redir)},
  stravaSync:async(manual)=>{try{const j=await stCall("sync");if(manual)window.toastMsg&&window.toastMsg(j.count!=null?j.count+(j.count===1?" corrida sincronizada":" corridas sincronizadas"):"Strava não conectado")}catch(e){if(manual)window.toastMsg&&window.toastMsg("Não consegui falar com o Strava: "+e.message)}},
  stravaDisconnect:async()=>{try{await stCall("disconnect");window.toastMsg&&window.toastMsg("Strava desconectado")}catch(e){window.toastMsg&&window.toastMsg(e.message)}}};
window.onRunsMine=(me,R)=>{if(!window.STRAVA.ready||!R||!R.connected)return;if(Date.now()-lastAuto<10*60e3)return;if(R.lastSync&&Date.now()-R.lastSync<10*60e3)return;lastAuto=Date.now();window.FB.stravaSync(false)};
let unsub=null,unsubR=null;
onAuthStateChanged(auth,u=>{if(unsub){unsub();unsub=null}
  if(!u){window.showAuth();return}
  const q=new URLSearchParams(location.search);if(q.get("state")==="treino"&&(q.get("code")||q.get("error"))){history.replaceState(null,"",location.pathname);if(q.get("code")){window.toastMsg&&window.toastMsg("Conectando ao Strava...");stCall("connect",q.get("code")).then(j=>window.toastMsg&&window.toastMsg("Strava conectado! "+(j.count||0)+((j.count===1)?" corrida":" corridas"))).catch(e=>window.toastMsg&&window.toastMsg("Strava: "+e.message))}}
  if(unsubR){unsubR();unsubR=null}
  unsubR=onSnapshot(collection(db,"corridas"),snap=>{const all={};snap.forEach(d=>all[d.id]=d.data());window.onRuns(u.uid,all)},()=>{});
  unsub=onSnapshot(collection(db,"atletas"),snap=>{const all={};snap.forEach(d=>all[d.id]=d.data());window.onData(u.uid,all)},
    err=>{$("#auth").hidden=false;$("#a-err").hidden=false;$("#a-err").textContent="Sua conta ainda não tem permissão. Peça para liberar o seu e-mail.";signOut(auth)});
});
let mode="login";
$("#a-toggle").onclick=()=>{mode=mode==="login"?"signup":"login";const s=mode==="signup";
  $("#a-name").hidden=$("#l-name").hidden=!s;$("#a-go").textContent=s?"Criar conta":"Entrar";$("#a-toggle").textContent=s?"Já tenho conta. Entrar":"Primeira vez? Criar conta";$("#a-pass").autocomplete=s?"new-password":"current-password"};
const MSG={"auth/invalid-credential":"E-mail ou senha errados.","auth/wrong-password":"Senha errada.","auth/user-not-found":"Não achei esse e-mail. Toque em Criar conta.","auth/email-already-in-use":"Esse e-mail já tem conta. Toque em Entrar.","auth/weak-password":"A senha precisa ter pelo menos 6 caracteres.","auth/invalid-email":"Confira o e-mail digitado.","auth/network-request-failed":"Sem internet. Tente de novo."};
$("#authform").onsubmit=async ev=>{ev.preventDefault();$("#a-err").hidden=true;const e=$("#a-email").value.trim().toLowerCase(),p=$("#a-pass").value;
  try{if(mode==="signup"){const n=$("#a-name").value.trim();if(!n)throw{code:"x",message:"Digite seu nome."};window.pendingName=n;await createUserWithEmailAndPassword(auth,e,p)}else await signInWithEmailAndPassword(auth,e,p)}
  catch(err){$("#a-err").hidden=false;$("#a-err").textContent=MSG[err.code]||err.message||"Algo deu errado."}};
if("serviceWorker" in navigator){let reloaded=false;const hadCtl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(hadCtl&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{reg.update();document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update()})}).catch(()=>{});}
</script>
